name: Rename branding to 뇌굴뇌굴

on:
  push:
    branches:
      - brand-naegulnaegul
    paths:
      - .github/workflows/rename-naegulnaegul.yml

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brand-naegulnaegul
      - name: Update visible branding
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'Cognitive Mole': '뇌굴뇌굴',
              'COGNITIVE MOLE': '뇌굴뇌굴',
              '순서 기억 두더지 게임': '뇌굴뇌굴',
              'Mole SVM 참고점수': '뇌굴뇌굴 SVM 참고점수',
          }

          targets = [Path('app.py')]
          targets += sorted(Path('aim_component_parts').glob('part*.txt'))

          for path in targets:
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in replacements.items():
                  text = text.replace(old, new)
              if path.name == 'part00.txt':
                  text = text.replace('<div class="eyebrow">뇌굴뇌굴 // PAPER-INSPIRED MOUSE TASK</div>', '<div class="eyebrow">BRAIN BURROW // PAPER-INSPIRED MOUSE TASK</div>')
              if text != original:
                  path.write_text(text, encoding='utf-8')
          PY
      - name: Commit branding changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py aim_component_parts
          if git diff --cached --quiet; then
            echo "No branding changes needed"
          else
            git commit -m "Rename service branding to 뇌굴뇌굴"
            git push origin HEAD:brand-naegulnaegul
          fi
